image: atlassian/default-image:latest
definitions:
  services:
    docker:
      memory: 8192
      cpus: "8.0"

pipelines:
  branches:
    develop:
        - step:
            runs-on:
              - 'self.hosted'
              - 'linux'
              - 'devops'
            size: 8x
            name: Build Devops Panel DEV Image
            image: docker:latest
            services:
              - docker
            script:
              - echo "$GCLOUD_API_KEYFILE" | base64 -d > gcr_key.json
              # Authenticate with GCR
              - cat gcr_key.json | docker login -u _json_key --password-stdin https://gcr.io
              - rm gcr_key.json
              - export DOCKER_BUILDKIT=0
              - docker build -f $DEVOPS_PANEL_DOCKERFILE_PATH . -t gcr.io/$GCLOUD_PROJECT_ID/$DEVOPS_PANEL_IMAGE_NAME:develop-$BITBUCKET_BUILD_NUMBER
              - docker tag gcr.io/$GCLOUD_PROJECT_ID/$DEVOPS_PANEL_IMAGE_NAME:develop-$BITBUCKET_BUILD_NUMBER gcr.io/$GCLOUD_PROJECT_ID/$DEVOPS_PANEL_IMAGE_NAME:develop-latest
              - docker push gcr.io/$GCLOUD_PROJECT_ID/$DEVOPS_PANEL_IMAGE_NAME:develop-$BITBUCKET_BUILD_NUMBER
              - docker push gcr.io/$GCLOUD_PROJECT_ID/$DEVOPS_PANEL_IMAGE_NAME:develop-latest
    staging:
      - parallel:
        - step:
            runs-on:
              - 'self.hosted'
              - 'linux'
              - 'devops'
            size: 8x
            name: Build Devops Panel STAGING Image
            image: docker:latest
            services:
              - docker
            script:
