              # Authenticate with GCR
              - cat gcr_key.json | docker login -u _json_key --password-stdin https://gcr.io
              - rm gcr_key.json
              - export DOCKER_BUILDKIT=0
              - docker build -f $DEVOPS_PANEL_DOCKERFILE_PATH . -t gcr.io/$GCLOUD_PROJECT_ID/$DEVOPS_PANEL_IMAGE_NAME:staging-$BITBUCKET_BUILD_NUMBER
              - docker tag gcr.io/$GCLOUD_PROJECT_ID/$DEVOPS_PANEL_IMAGE_NAME:staging-$BITBUCKET_BUILD_NUMBER gcr.io/$GCLOUD_PROJECT_ID/$DEVOPS_PANEL_IMAGE_NAME:staging-latest
              - docker push gcr.io/$GCLOUD_PROJECT_ID/$DEVOPS_PANEL_IMAGE_NAME:staging-$BITBUCKET_BUILD_NUMBER
              - docker push gcr.io/$GCLOUD_PROJECT_ID/$DEVOPS_PANEL_IMAGE_NAME:staging-latest
